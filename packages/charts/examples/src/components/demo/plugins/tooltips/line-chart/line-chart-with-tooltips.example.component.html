<p id="line-chart-keyboard-instructions" i18n>
    Tab to the chart and use Left and Right Arrow to inspect data points. Escape
    closes the tooltips. Tab leaves the chart.
</p>
<div class="nui-chart-layout">
    <div class="chart">
        <nui-chart
            class="w-100"
            [chart]="chart"
            [keyboardTooltips]="tooltipsPlugin"
            ariaLabel="Response time by date"
            i18n-ariaLabel
            aria-describedby="line-chart-keyboard-instructions"></nui-chart>
    </div>
    <div class="legend">
        <nui-legend
            seriesUnitLabel="sec"
            [active]="chartAssist.isLegendActive"
            [interactive]="true"
            (mouseleave)="chartAssist.resetVisibleSeries()">
            <nui-legend-series
                *ngFor="
                    let legendSeries of chartAssist.legendSeriesSet;
                    trackBy: chartAssist.seriesTrackByFn
                "
                [descriptionPrimary]="legendSeries['name']"
                (mouseenter)="chartAssist.emphasizeSeries(legendSeries.id)"
                [seriesRenderState]="
                    chartAssist.renderStatesIndex[legendSeries.id]?.state
                "
                [isSelected]="!chartAssist.isSeriesHidden(legendSeries.id)"
                (isSelectedChange)="
                    chartAssist.toggleSeries(legendSeries.id, $event)
                ">
                <nui-rich-legend-tile
                    [value]="chartAssist.getHighlightedValue(legendSeries, 'y')"
                    [backgroundColor]="
                        chartAssist.palette.standardColors.get(legendSeries.id)
                    "
                    [color]="
                        chartAssist.palette.textColors.get(legendSeries.id)
                    ">
                    <nui-chart-marker
                        rightEdge
                        [marker]="chartAssist.markers.get(legendSeries.id)"
                        [color]="
                            chartAssist.palette.standardColors.get(
                                legendSeries.id
                            )
                        ">
                    </nui-chart-marker>
                </nui-rich-legend-tile>
            </nui-legend-series>
        </nui-legend>
    </div>
</div>

<nui-chart-tooltips
    [plugin]="tooltipsPlugin"
    [template]="tooltipTemplate"></nui-chart-tooltips>

<ng-template let-dataPoint="dataPoint" #tooltipTemplate>
    <div class="p-1 d-flex align-items-center">
        <span class="sr-only">{{ dataPoint.dataSeries.name }}: </span>
        <nui-chart-marker
            [marker]="chartAssist.markers.get(dataPoint.seriesId)"
            [color]="chartAssist.palette.standardColors.get(dataPoint.seriesId)"></nui-chart-marker>
        <span class="pl-2">{{ dataPoint.data.y }}</span>
        <span class="sr-only">
            {{ dataPoint.data.x.toDate() | date: "mediumDate" }}
        </span>
    </div>
</ng-template>
