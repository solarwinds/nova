<div class="container">
    <nui-paginator-basic-example></nui-paginator-basic-example>

    <nui-paginator-adjacent-example></nui-paginator-adjacent-example>

    <nui-paginator
        id="nui-demo-body-paginator"
        [page]="1"
        [pageSize]="10"
        [total]="400"
        [appendToBody]="true">
    </nui-paginator>

    <div id="nui-demo-dynamic-paginators" style="display: none">
        <input
            #dynamicTotalInput
            id="nui-demo-dynamic-total"
            type="number"
            [value]="dynamicTotal"
            (input)="dynamicTotal = dynamicTotalInput.valueAsNumber"
            hidden />
        <nui-paginator
            id="nui-demo-dynamic-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="dynamicTotal"
            [appendToBody]="false">
        </nui-paginator>

        <nui-paginator
            id="nui-demo-body-dynamic-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="dynamicTotal"
            [appendToBody]="true">
        </nui-paginator>
    </div>

    <div id="nui-demo-virtualized-paginators" style="display: none">
        <input
            #virtualizedTotalInput
            id="nui-demo-virtualized-total"
            type="number"
            [value]="virtualizedTotal"
            (input)="virtualizedTotal = virtualizedTotalInput.valueAsNumber"
            hidden />
        <nui-paginator
            id="nui-demo-virtualized-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="virtualizedTotal"
            [appendToBody]="false">
        </nui-paginator>

        <nui-paginator
            id="nui-demo-body-virtualized-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="virtualizedTotal"
            [appendToBody]="true">
        </nui-paginator>
    </div>
</div>
