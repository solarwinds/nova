<div class="container">
    <nui-paginator-basic-example></nui-paginator-basic-example>

    <nui-paginator-adjacent-example></nui-paginator-adjacent-example>

    <nui-paginator
        id="nui-demo-body-paginator"
        [page]="1"
        [pageSize]="10"
        [total]="400"
        [appendToBody]="true">
    </nui-paginator>

    <div id="nui-demo-virtualized-paginators" style="display: none">
        <nui-paginator
            id="nui-demo-virtualized-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="20000"
            [appendToBody]="false">
        </nui-paginator>

        <nui-paginator
            id="nui-demo-body-virtualized-paginator"
            [page]="1"
            [pageSize]="10"
            [total]="20000"
            [appendToBody]="true">
        </nui-paginator>
    </div>
</div>
