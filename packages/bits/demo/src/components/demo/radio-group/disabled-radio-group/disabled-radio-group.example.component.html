<h1 i18n>Selected fruit: {{ selectedFruit }}</h1>
<nui-radio-group
    id="fruit-radio-group"
    name="fruit-disabled"
    ariaLabel="Disabled fruit selection"
    i18n-ariaLabel
    [(value)]="selectedFruit">
    <nui-radio
        *ngFor="let fruit of fruits"
        [value]="fruit"
        [checked]="fruit === 'Orange'"
        [disabled]="fruit === 'Banana'">
        {{ fruit }}
    </nui-radio>
</nui-radio-group>
