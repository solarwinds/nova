<div class="nui-time-frame-picker">
    <div class="nui-time-frame-picker__date-times">
        <label
            class="nui-time-frame-picker__label"
            [id]="startLabelId"
            >{{ startLabel }}</label
        >
        <span
            class="nui-time-frame-picker__date-time nui-time-frame-picker__date-time_start"
            role="group"
            [attr.aria-labelledby]="startLabelId">
            <nui-date-time-picker
                [ariaLabel]="startLabel"
                [ariaDescribedby]="ariaDescribedby"
                [minDate]="minDate"
                [maxDate]="maxDate"
                [model]="model.startDatetime"
                (modelChanged)="onChangeInternalStart($event)"
                (focus)="onFocusInternal()"
                (blur)="onBlurInternal()"
                [appendToBody]="appendToBody"></nui-date-time-picker>
        </span>
        <label
            class="nui-time-frame-picker__label"
            [id]="endLabelId"
            >{{ endLabel }}</label
        >
        <span
            class="nui-time-frame-picker__date-time nui-time-frame-picker__date-time_end"
            role="group"
            [attr.aria-labelledby]="endLabelId">
            <nui-date-time-picker
                [ariaLabel]="endLabel"
                [ariaDescribedby]="ariaDescribedby"
                [minDate]="minDate"
                [maxDate]="maxDate"
                [model]="model.endDatetime"
                (modelChanged)="onChangeInternalEnd($event)"
                (focus)="onFocusInternal()"
                (blur)="onBlurInternal()"
                [appendToBody]="appendToBody"></nui-date-time-picker>
        </span>
    </div>
</div>
