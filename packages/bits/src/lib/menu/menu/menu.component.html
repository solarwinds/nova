<nui-popup
    [class.nui-menu--compact]="isMenuCompact()"
    (opened)="onMenuOpen($event)"
    [appendToBody]="appendToBody"
    [width]="widthOfPopup"
    [contextClass]="contextClass + ' nui-menu-popup-host'">
    <button
        #menuToggle
        nui-button
        nuiPopupToggle
        [role]="'menu'"
        [toggleOnKey]="false"
        [disabled]="isDisabled"
        [opened]="popup?.isOpen || false"
        [id]="menuTriggerId"
        [ariaControls]="popup?.isOpen ? popupContentId : null"
        type="button"
        (blur)="onBlur($event)"
        [displayStyle]="displayStyle"
        [size]="size"
        [icon]="icon"
        [iconRight]="isTitlePresent()"
        class="menu-button no-shadow"
        [isEmpty]="!isTitlePresent()"
        [attr.aria-describedby]="ariaDescribedby || null"
        [ariaLabel]="menuAriaLabel">
        <span>{{ title }}</span>
    </button>
    <div
        #menuContent
        popupAreaContent
        [id]="popupContentId"
        role="menu"
        tabindex="-1"
        [attr.aria-labelledby]="menuTriggerId"
        [attr.aria-activedescendant]="
            popup?.isOpen ? activeDescendant : null
        "
        (blur)="onBlur($event)">
        @if (itemsSource) {
        <nui-menu-popup
            role="presentation"
            [itemsSource]="itemsSource"
            [size]="size"></nui-menu-popup>
        } @else {
        <ng-content></ng-content>
        }
    </div>
</nui-popup>
