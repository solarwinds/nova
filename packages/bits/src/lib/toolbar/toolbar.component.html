<div
    class="nui-toolbar-content"
    nuiResizeObserver
    (containerResize)="scheduleMoveToolbarItems()"
    #toolbarContainer
>
    <div class="nui-toolbar-content__dynamic">
        <ng-template
            ngFor
            let-commandGroup
            let-last="last"
            [ngForOf]="commandGroups"
        >
            <ng-template ngFor let-commandItem [ngForOf]="commandGroup.items">
                <!-- tabindex 0 is assigned to the first enabled item so a fully-disabled toolbar stays reachable via Tab -->
                <button
                    nui-button
                    type="button"
                    #toolbarButtons
                    [tabindex]="isFirstFocusableItem(commandItem) ? 0 : -1"
                    [disabled]="commandItem.disabled"
                    (click)="onClickToolbarBtn($event, commandItem)"
                    [displayStyle]="
                        commandItem.displayStyle === 'main'
                            ? 'primary'
                            : commandItem.displayStyle
                    "
                    [ngClass]="{
                        'nui-toolbar-primary-item':
                            commandItem.displayStyle === 'main'
                    }"
                    [icon]="commandItem.icon"
                >
                    <span>{{ commandItem.title }}</span>
                </button>
            </ng-template>
            <nui-divider
                *ngIf="!last || showMenu"
                isVertical="true"
                size="extra-small"
            ></nui-divider>
        </ng-template>
        <nui-menu
            displayStyle="action"
            #menuComponent
            [appendToBody]="appendToBody"
            [title]="menuTitle"
        >
            <ng-template ngFor let-menuGroup [ngForOf]="menuGroups">
                <nui-menu-group [header]="menuGroup.title">
                    <ng-template ngFor let-menuItem [ngForOf]="menuGroup.items">
                        <nui-menu-action
                            [type]="
                                menuItem.isDestructive
                                    ? 'destructive'
                                    : 'default'
                            "
                            [icon]="menuItem.icon"
                            [disabled]="menuItem.disabled"
                            (actionDone)="menuItem.actionDone.emit()"
                            >{{ menuItem.title }}
                        </nui-menu-action>
                    </ng-template>
                </nui-menu-group>
            </ng-template>
        </nui-menu>
        <ng-container>
            @if (allItemsHidden && !showMenu && !noEmptyMessage) {
            <nui-toolbar-message>
                @if (selectionEnabled) {
                <ng-container i18n
                    >No actions available for this selection</ng-container
                >
                } @if (!selectionEnabled) {
                <ng-container i18n>No actions available</ng-container>
                }
            </nui-toolbar-message>
            }
            <ng-content select="nui-toolbar-message"></ng-content>
        </ng-container>
    </div>
    <div class="nui-toolbar-content__embedded">
        @if (selectionEnabled) {
        <div class="nui-toolbar-content__select">
            {{ handleSelectionState() }}
        </div>
        }
        <ng-content></ng-content>
        <ng-content select=".nui-toolbar-embedded"></ng-content>
    </div>
</div>
