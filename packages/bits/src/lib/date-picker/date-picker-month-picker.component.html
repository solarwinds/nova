<div *ngIf="datePicker.datepickerMode === 'month'" class="nui-datepicker-nav">
    <button
        nui-button
        type="button"
        displayStyle="action"
        icon="caret-left"
        ariaLabel="Previous year"
        i18n-ariaLabel="@@prevYear"
        title="Previous year"
        (click)="datePicker.move(-1, $event)"
    ></button>
    <button
        nui-button
        type="button"
        [id]="datePicker.uniqueId + '-title'"
        displayStyle="action"
        [disabled]="datePicker.datepickerMode === maxMode"
        class="change-mode-button"
        [ngClass]="{
            disabled: datePicker.datepickerMode === maxMode
        }"
        (click)="datePicker.toggleMode($event)"
    >
        <span>{{ title }}</span>
    </button>
    <button
        nui-button
        type="button"
        displayStyle="action"
        icon="caret-right"
        ariaLabel="Next year"
        i18n-ariaLabel="@@nextYear"
        title="Next year"
        (click)="datePicker.move(1, $event)"
    ></button>
</div>
<table *ngIf="datePicker.datepickerMode === 'month'" role="grid" [attr.aria-labelledby]="datePicker.uniqueId + '-title'">
    <tbody>
        <tr *ngFor="let row of rows; trackBy: trackByIndex">
            <td
                *ngFor="let cell of row; trackBy: trackByCellUid"
                class="text-center month"
                id="{{ cell.uid }}"
                role="presentation"
            >
                <button
                    nui-button
                    type="button"
                    #cellButton
                    role="gridcell"
                    displayStyle="action"
                    [ngClass]="{
                        selected: cell.selected,
                        disabled: cell.disabled
                    }"
                    [disabled]="cell.disabled"
                    [attr.tabindex]="cell.isFocusTarget ? 0 : -1"
                    [ariaLabel]="cell.ariaLabel"
                    [attr.aria-selected]="cell.selected ? true : null"
                    (click)="datePicker.select(cell.date, $event)">
                    <span [ngClass]="{ 'text-info': cell.current }">{{
                        cell.label
                    }}</span>
                </button>
            </td>
        </tr>
    </tbody>
</table>
