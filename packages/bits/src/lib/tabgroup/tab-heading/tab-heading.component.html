<div
    class="nui-tab-heading"
    [class.active]="active"
    [tabindex]="disabled ? -1 : 0"
    [attr.aria-selected]="active ? 'true' : 'false'"
    [attr.id]="tabControlId"
    [attr.aria-controls]="ariaControls"
    role="tab"
    (click)="selectTab()"
    (keydown)="onKeyDown($event)">
    <span class="tab-link">
        <ng-content></ng-content>
    </span>
</div>
