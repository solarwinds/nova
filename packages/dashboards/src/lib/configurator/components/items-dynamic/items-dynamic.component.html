<div
    class="nui-items-dynamic"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
    [formGroup]="form">
    <span
        class="nui-items-dynamic__a11y-text"
        [id]="reorderInstructionsId"
        i18n>
        Press Space or Enter to pick up this item. Use the arrow keys to move
        it. Press Space or Enter to drop it, or Escape to restore its original
        position.
    </span>
    <span
        class="nui-items-dynamic__a11y-text"
        aria-live="polite"
        aria-atomic="true">
        {{ reorder.announcement }}
    </span>
    <div
        cdkDrag
        class="nui-items-dynamic__node-item"
        (cdkDragStarted)="cdkDragStarted($event)"
        *ngFor="let node of nodeConfigs; let i = index; trackBy: trackBy">
        <nui-drop-area
            class="nui-items-dynamic__drop-area"
            *cdkDragPlaceholder
            [style.height.px]="height"></nui-drop-area>

        <ng-template #headerText>
            @if (moveButtons) {
            <div
                class="nui-items-dynamic__drag-handler"
                cdkDragHandle
                role="button"
                [attr.tabindex]="form?.at(i)?.enabled ? 0 : -1"
                [attr.aria-disabled]="form?.at(i)?.enabled ? null : 'true'"
                [attr.aria-pressed]="reorder.activeItem === node.id"
                aria-label="Reorder item"
                i18n-aria-label
                [attr.aria-describedby]="reorderInstructionsId"
                (keydown)="reorder.onKeydown($event, node.id)"
                (blur)="reorder.finish()">
                <nui-icon icon="drag" aria-hidden="true"></nui-icon>
            </div>
            }
            <span
                [title]="
                    headerMap.get(node.id)
                        | nuiWidgetConfiguratorSectionHeader : i : headerPrefix
                "
                class="nui-items-dynamic__header-text">
                {{
                    headerMap.get(node.id)
                        | nuiWidgetConfiguratorSectionHeader : i : headerPrefix
                }}
            </span>
        </ng-template>

        <ng-template #headerButtons>
            <div class="d-flex">
                <!-- TODO: remove "kpi" prefix in v11 - NUI-5833 -->
                <button
                    id="kpi-widget-remove-btn-{{ i }}"
                    nui-button
                    type="button"
                    icon="delete"
                    displayStyle="action"
                    aria-label="Remove item"
                    i18n-aria-label
                    (click)="removeItem(getItemForNode(node), i)"></button>
            </div>
        </ng-template>

        <ng-container
            nuiComponentPortal
            #componentPortal="nuiComponentPortal"
            [componentId]="node.id"
            [componentType]="node.componentType"
            [providers]="node.providers"
            [properties]="
                node.properties
                    | nuiAddData : headerText : 'headerTextTemplate'
                    | nuiAddData : headerButtons : 'headerButtonsTemplate'
            "
            [outputs]="['formReady', 'formDestroy']"
            (output)="onEvent(node.id, $event)">
            <ng-template
                [cdkPortalOutlet]="componentPortal.portal"
                (attached)="componentPortal.attached($event)">
            </ng-template>
        </ng-container>
    </div>
</div>
